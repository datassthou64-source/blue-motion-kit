<!DOCTYPE html>
<html lang="en"><head></head><body>
<!--
  TEMPLATE  07-converge-rollup
  ARGUMENT  "everything reports up into one place." N workers along the bottom
            each fire one packet up into a single stack, the stack fills slot
            by slot, and a period marker advances once to close the cycle.
  SWAP      CFG.workers (3-6), CFG.stackLabel, CFG.tag. Set CFG.periodTicks to
            0 when the VO is not describing a recurring cycle.
  PREFIX    cv-
-->
<template>
  <style>
    #cv-root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:#FDFDFD}
    #cv-shade{position:absolute;inset:0;background:radial-gradient(ellipse 66% 74% at 50% 48%,rgba(0,22,66,.28),rgba(0,22,66,.78))}
    #cv-head{position:absolute;left:770px;top:120px;width:380px;height:150px;border-radius:75px;border:6px solid #FDFDFD;background:rgba(0,22,66,.88);box-shadow:0 0 44px rgba(95,230,253,.28);display:grid;place-items:center;font-size:44px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#5FE6FD;text-shadow:0 0 24px rgba(0,0,0,.85),0 0 42px rgba(95,230,253,.45);opacity:0}
    #cv-stack{position:absolute;left:740px;top:310px;width:440px;height:250px;border-radius:30px;border:4px solid rgba(253,253,253,.6);background:rgba(4,26,72,.66);box-shadow:0 0 34px rgba(95,230,253,.2);opacity:0}
    .cv-slot{position:absolute;left:30px;width:376px;height:38px;border-radius:19px;background:rgba(253,253,253,.12)}
    .cv-fn{position:absolute;top:790px;width:220px;height:120px;border-radius:60px;border:5px solid #FDFDFD;background:rgba(0,22,66,.82);box-shadow:0 0 30px rgba(95,230,253,.2);display:grid;place-items:center;opacity:0}
    .cv-fp{width:26px;height:26px;border-radius:50%;background:rgba(253,253,253,.9)}
    .cv-pk{position:absolute;width:180px;height:34px;border-radius:17px;background:#5FE6FD;box-shadow:0 0 30px rgba(95,230,253,.7);opacity:0}
    #cv-svg{position:absolute;inset:0;width:1920px;height:1080px}
    .cv-guide{fill:none;stroke:rgba(253,253,253,.34);stroke-width:4;stroke-linecap:round;stroke-dasharray:12 16;opacity:0}
    .cv-tick{position:absolute;top:1000px;width:120px;height:8px;border-radius:4px;background:rgba(253,253,253,.3)}
    #cv-meta{position:absolute;left:960px;top:944px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:rgba(253,253,253,.86);text-shadow:0 0 20px rgba(0,0,0,.9);opacity:0}
    #cv-tag{position:absolute;left:960px;top:626px;font-size:52px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#5FE6FD;white-space:nowrap;text-shadow:0 0 28px rgba(0,0,0,.92),0 4px 18px rgba(0,0,0,.75),0 0 46px rgba(95,230,253,.45);opacity:0}
  </style>

  <div data-hf-id="cv-root" id="cv-root" data-composition-id="converge-rollup" data-start="0" data-duration="8.0" data-width="1920" data-height="1080">
    <div data-hf-id="cv-shade" id="cv-shade"></div>
    <svg data-hf-id="cv-svg" id="cv-svg" viewBox="0 0 1920 1080"></svg>
    <div data-hf-id="cv-stack" id="cv-stack"></div>
    <div data-hf-id="cv-head" id="cv-head">Chief</div>
    <div data-hf-id="cv-meta" id="cv-meta">End Of Day Rollup</div>
    <div data-hf-id="cv-tag" id="cv-tag">One Answer</div>
  </div>

  <script>
    window.__timelines=window.__timelines||{};
    const cvTl=gsap.timeline({paused:true});

    /* ===== CONFIG ==================================================== */
    const CV = {
      headLabel: "Chief",              // who the rollup lands with
      meta: "End Of Day Rollup",
      tag:  "One Answer",              // cyan payoff, sits right of the stack
      workers: 4,                      // 3-6 reporters along the bottom
      periodTicks: 3,                  // day/cycle markers; 0 to omit
      firstSend: 2.4,
      sendGap: 0.18
    };
    /* ================================================================= */

    const cvRoot=document.getElementById("cv-root"), cvSvg=document.getElementById("cv-svg");
    document.getElementById("cv-head").textContent=CV.headLabel;
    document.getElementById("cv-meta").textContent=CV.meta;
    document.getElementById("cv-tag").textContent=CV.tag;
    gsap.set(["#cv-meta","#cv-tag"],{xPercent:-50});
    gsap.set("#cv-tag",{left:"1340px"});

    /* stack slots — one per worker, centred inside the 250px stack */
    const cvStack=document.getElementById("cv-stack");
    const CV_PITCH=56, CV_SLOT0=(250-(CV.workers*38+(CV.workers-1)*(CV_PITCH-38)))/2;
    const CV_STACK_L=740, CV_STACK_T=310;
    for(let i=0;i<CV.workers;i++){
      const s=document.createElement("i");
      s.className="cv-slot"; s.id="cv-s"+i; s.setAttribute("data-hf-id","cv-s"+i);
      s.style.top=(CV_SLOT0+i*CV_PITCH)+"px";
      cvStack.appendChild(s);
    }

    const cvSpan=Math.min(1560,470*(CV.workers-1)), cvStep=CV.workers>1?cvSpan/(CV.workers-1):0, cvX0=960-cvSpan/2;
    const cvW=[];
    for(let i=0;i<CV.workers;i++){
      const cx=CV.workers>1?cvX0+i*cvStep:960, id="cv-w"+i;
      const d=document.createElement("div");
      d.className="cv-fn"; d.id=id; d.setAttribute("data-hf-id",id);
      d.style.left=(cx-110)+"px";
      d.innerHTML='<i data-hf-id="'+id+'p" id="'+id+'p" class="cv-fp"></i>';
      cvRoot.appendChild(d);

      const pk=document.createElement("i");
      pk.className="cv-pk"; pk.id="cv-q"+i; pk.setAttribute("data-hf-id","cv-q"+i);
      pk.style.left=(cx-90)+"px"; pk.style.top="840px";
      cvRoot.appendChild(pk);

      const g=document.createElementNS("http://www.w3.org/2000/svg","path");
      const tx=960+(i-(CV.workers-1)/2)*44;
      g.setAttribute("d","M"+cx+" 790 C"+cx+" 690,"+tx+" 640,"+tx+" "+(CV_STACK_T+250));
      g.setAttribute("class","cv-guide"); g.id="cv-g"+i; g.setAttribute("data-hf-id","cv-g"+i);
      cvSvg.appendChild(g);

      /* the packet flies into ITS slot inside the stack, not at a guessed point */
      const slotX=CV_STACK_L+30+(376-180)/2, slotY=CV_STACK_T+CV_SLOT0+i*CV_PITCH+2;
      cvW.push({node:"#"+id,pip:"#"+id+"p",pk:"#cv-q"+i,dx:slotX-(cx-90),dy:slotY-840});
    }

    for(let i=0;i<CV.periodTicks;i++){
      const t=document.createElement("i");
      t.className="cv-tick"; t.id="cv-k"+i; t.setAttribute("data-hf-id","cv-k"+i);
      t.style.left=(960-(CV.periodTicks*140-20)/2+i*140)+"px";
      cvRoot.appendChild(t);
    }

    /* the shape assembles */
    cvTl.fromTo("#cv-head",{opacity:0,y:-60,scale:.8},{opacity:1,y:0,scale:1,duration:.55,ease:"power3.out"},.1);
    cvW.forEach(function(w,i){ cvTl.fromTo(w.node,{opacity:0,y:70,scale:.74},{opacity:1,y:0,scale:1,duration:.5,ease:"power3.out"},.35+i*.14); });
    cvTl.fromTo(".cv-guide",{opacity:0},{opacity:1,duration:.4,ease:"power2.out",stagger:.05},1.1);
    cvTl.fromTo("#cv-stack",{opacity:0,scale:.82},{opacity:1,scale:1,duration:.5,ease:"power3.out"},1.7);

    /* every worker sends one packet up and it stacks */
    cvW.forEach(function(w,i){
      const at=CV.firstSend+i*CV.sendGap;
      cvTl.fromTo(w.pk,{opacity:0,scale:.5},{opacity:1,scale:1,duration:.24,ease:"power3.out"},at);
      cvTl.to(w.pk,{x:w.dx,y:w.dy,duration:1.25,ease:"power2.inOut"},at+.2);
      cvTl.to(w.pk,{scaleX:1.05,duration:.2,ease:"power4.out"},at+1.45);
      cvTl.to(w.pk,{scaleX:1,opacity:.9,boxShadow:"0 0 14px rgba(95,230,253,.45)",duration:.3,ease:"power2.out"},at+1.65);
      cvTl.to("#cv-stack",{borderColor:"#5FE6FD",duration:.3,ease:"power2.out"},at+1.45);
      cvTl.to("#cv-s"+i,{backgroundColor:"rgba(95,230,253,.30)",duration:.3,ease:"power2.out"},at+1.5);
    });
    const cvDone=CV.firstSend+(CV.workers-1)*CV.sendGap+1.65;
    cvTl.fromTo("#cv-meta",{opacity:0,y:14},{opacity:1,y:0,duration:.36,ease:"power3.out"},cvDone+.15);
    cvTl.to(cvW.map(function(w){return w.pip;}),{backgroundColor:"#5FE6FD",scale:1.3,duration:.26,ease:"power3.out",stagger:.12},cvDone+.35);
    cvTl.to(".cv-guide",{opacity:.55,duration:.5,ease:"power2.out"},cvDone+.35);

    /* the cycle marker advances once and closes */
    for(let i=0;i<CV.periodTicks;i++)
      cvTl.to("#cv-k"+i,{backgroundColor:"#5FE6FD",boxShadow:"0 0 24px rgba(95,230,253,.7)",duration:.28,ease:"power3.out"},cvDone+.8+i*.4);

    cvTl.fromTo("#cv-tag",{opacity:0,scale:1.18},{opacity:1,scale:1,duration:.42,ease:"power4.out"},cvDone+1.5);
    cvTl.to("#cv-stack",{scale:1.03,boxShadow:"0 0 70px rgba(95,230,253,.45)",duration:.45,ease:"sine.inOut",yoyo:true,repeat:1},cvDone+1.7);

    window.__timelines["converge-rollup"]=cvTl;
  </script>
</template>
</body></html>
