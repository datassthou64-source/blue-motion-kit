<!DOCTYPE html>
<html lang="en"><head></head><body>
<!--
  TEMPLATE  01-crack-reveal
  ARGUMENT  "everyone thinks it's X — it's not." The familiar object is built,
            given a beat of ordinary life, then a cyan fault line splits it and
            the real thing lands in the hole.
  SWAP      CFG.oldLabel / CFG.newLabel / CFG.mark (the real product's logo).
            The vessel is a chat bubble here; make it whatever the VO names —
            a card, a window, a box. Keep the crack, the fall and the slam.
  PREFIX    cr-   (sed 's/cr-/s07-/g' if you use this twice in one project)
-->
<template>
  <style>
    #cr-root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:#FDFDFD}
    #cr-shade{position:absolute;inset:0;background:radial-gradient(ellipse 60% 66% at 50% 46%,rgba(0,22,66,.28),rgba(0,22,66,.75));opacity:0}
    .cr-half{position:absolute;left:560px;top:280px;width:800px;height:440px;border:6px solid rgba(253,253,253,.92);border-radius:64px;background:rgba(4,26,72,.62);box-shadow:0 0 46px rgba(95,230,253,.18),inset 0 0 90px rgba(1,183,249,.12);opacity:0}
    #cr-hl{clip-path:polygon(0 0,54% 0,44% 100%,0 100%)}
    #cr-hr{clip-path:polygon(54% 0,100% 0,100% 100%,44% 100%)}
    #cr-dots{position:absolute;left:560px;top:280px;width:800px;height:440px;display:flex;align-items:center;justify-content:center;gap:44px;opacity:0}
    .cr-dot{width:46px;height:46px;border-radius:50%;background:rgba(253,253,253,.9);box-shadow:0 0 26px rgba(253,253,253,.35)}
    #cr-tail{position:absolute;left:640px;top:706px;width:96px;height:96px;border-left:6px solid rgba(253,253,253,.92);border-bottom:6px solid rgba(253,253,253,.92);border-bottom-left-radius:38px;background:rgba(4,26,72,.62);opacity:0}
    #cr-paint{position:absolute;left:560px;top:280px;width:800px;height:440px;border-radius:64px;overflow:hidden;opacity:0}
    #cr-band{position:absolute;left:-620px;top:-160px;width:520px;height:760px;transform:rotate(14deg);background:linear-gradient(90deg,rgba(95,230,253,0),rgba(95,230,253,.62),rgba(95,230,253,0))}
    #cr-crack{position:absolute;inset:0;width:1920px;height:1080px}
    #cr-crack path{fill:none;stroke:#5FE6FD;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 16px rgba(95,230,253,.85));opacity:0}
    #cr-plate{position:absolute;left:790px;top:330px;width:340px;height:340px;border-radius:68px;background:#FDFDFD;border:5px solid #FDFDFD;box-shadow:0 26px 70px rgba(0,22,66,.5);display:grid;place-items:center;opacity:0}
    #cr-plate svg,#cr-plate img{width:64%;height:64%;object-fit:contain;display:block}
    .cr-lbl{position:absolute;left:960px;top:790px;font-size:44px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 26px rgba(0,0,0,.75),0 4px 18px rgba(0,0,0,.6),0 0 44px rgba(255,255,255,.26);opacity:0}
    #cr-new{color:#5FE6FD;text-shadow:0 0 26px rgba(0,0,0,.85),0 4px 18px rgba(0,0,0,.6),0 0 44px rgba(95,230,253,.45)}
    .cr-tick{position:absolute;width:3px;height:26px;background:rgba(253,253,253,.42);opacity:0}
  </style>

  <div data-hf-id="cr-root" id="cr-root" data-composition-id="crack-reveal" data-start="0" data-duration="7.2" data-width="1920" data-height="1080">
    <div data-hf-id="cr-shade" id="cr-shade"></div>

    <i data-hf-id="cr-t1" id="cr-t1" class="cr-tick" style="left:150px;top:520px"></i>
    <i data-hf-id="cr-t2" id="cr-t2" class="cr-tick" style="left:190px;top:520px"></i>
    <i data-hf-id="cr-t3" id="cr-t3" class="cr-tick" style="left:1730px;top:520px"></i>
    <i data-hf-id="cr-t4" id="cr-t4" class="cr-tick" style="left:1770px;top:520px"></i>

    <div data-hf-id="cr-tail" id="cr-tail"></div>
    <div data-hf-id="cr-hl" id="cr-hl" class="cr-half"></div>
    <div data-hf-id="cr-hr" id="cr-hr" class="cr-half"></div>
    <div data-hf-id="cr-dots" id="cr-dots"><i data-hf-id="cr-d1" class="cr-dot"></i><i data-hf-id="cr-d2" class="cr-dot"></i><i data-hf-id="cr-d3" class="cr-dot"></i></div>
    <div data-hf-id="cr-paint" id="cr-paint" data-layout-allow-overflow><i data-hf-id="cr-band" id="cr-band" data-layout-allow-overflow></i></div>

    <svg data-hf-id="cr-crack" id="cr-crack" viewBox="0 0 1920 1080">
      <path data-hf-id="cr-crack-p" id="cr-crack-p" d="M992 280 L946 400 L1004 476 L938 588 L992 664 L946 720"/>
    </svg>

    <!-- REPLACE the inline mark with the real product's sourced logo:
         <img data-hf-id="cr-mark" id="cr-mark" src="assets/logos/<product>.svg" alt=""> -->
    <div data-hf-id="cr-plate" id="cr-plate">
      <svg data-hf-id="cr-mark" id="cr-mark" viewBox="0 0 120 120">
        <circle data-hf-id="cr-mark-c" cx="60" cy="60" r="42" fill="none" stroke="#0A2F6B" stroke-width="9"/>
        <path data-hf-id="cr-mark-p" d="M60 22 L60 98" stroke="#0A2F6B" stroke-width="9" stroke-linecap="round"/>
      </svg>
    </div>

    <div data-hf-id="cr-old" id="cr-old" class="cr-lbl">Old Thing</div>
    <div data-hf-id="cr-new" id="cr-new" class="cr-lbl">New Thing</div>
  </div>

  <script>
    window.__timelines=window.__timelines||{};
    const crTl=gsap.timeline({paused:true});

    /* ===== CONFIG ==================================================== */
    const CR = {
      oldLabel:  "Chatbot",      // what the audience assumes it is
      newLabel:  "The Real Thing", // what it actually is — this one is cyan
      idleBeat:  3.6,            // when the assumed label lands
      paintAt:   4.75,           // the "new coat of paint" sweep
      breakAt:   5.95            // the fault line — put this on the turn word
    };
    /* ================================================================= */

    document.getElementById("cr-old").textContent = CR.oldLabel;
    document.getElementById("cr-new").textContent = CR.newLabel;
    gsap.set(["#cr-old","#cr-new"],{xPercent:-50});

    const crP=document.getElementById("cr-crack-p"), crL=crP.getTotalLength();
    crP.style.strokeDasharray=String(crL); crP.style.strokeDashoffset=String(crL);

    /* the familiar object builds and lives an ordinary life */
    crTl.to("#cr-shade",{opacity:.55,duration:.5,ease:"power2.out"},0);
    crTl.fromTo(["#cr-hl","#cr-hr"],{opacity:0,scale:.72,y:40},{opacity:1,scale:1,y:0,duration:.55,ease:"back.out(1.5)"},.1);
    crTl.fromTo("#cr-tail",{opacity:0,scale:.5},{opacity:1,scale:1,duration:.35,ease:"power3.out"},.34);
    crTl.fromTo("#cr-dots",{opacity:0},{opacity:1,duration:.3},.5);
    crTl.fromTo([".cr-dot"],{y:14,opacity:.45},{y:-14,opacity:1,duration:.42,ease:"sine.inOut",yoyo:true,repeat:7,stagger:.12},.6);
    crTl.fromTo(".cr-tick",{opacity:0,scaleY:.3},{opacity:1,scaleY:1,duration:.4,ease:"power2.out",stagger:.06},.7);
    crTl.fromTo("#cr-old",{opacity:0,y:22},{opacity:1,y:0,duration:.45,ease:"power3.out"},CR.idleBeat);

    /* a coat of paint — the thing everyone thinks the update was */
    crTl.set("#cr-paint",{opacity:1},CR.paintAt);
    crTl.fromTo("#cr-band",{x:0},{x:1620,duration:1.05,ease:"power1.inOut"},CR.paintAt+.03);
    crTl.set("#cr-paint",{opacity:0},CR.paintAt+1.15);

    /* the fault line, the fall, and the real thing in the hole */
    crTl.set("#cr-crack-p",{opacity:1},CR.breakAt);
    crTl.to("#cr-crack-p",{strokeDashoffset:0,duration:.35,ease:"power2.out"},CR.breakAt);
    crTl.to("#cr-old",{opacity:0,y:-16,duration:.28,ease:"power2.in"},CR.breakAt+.15);
    crTl.to("#cr-hl",{x:-300,y:210,rotation:-16,opacity:0,duration:.62,ease:"power2.in"},CR.breakAt+.27);
    crTl.to("#cr-hr",{x:320,y:250,rotation:19,opacity:0,duration:.62,ease:"power2.in"},CR.breakAt+.27);
    crTl.to(["#cr-tail","#cr-dots"],{y:240,opacity:0,duration:.5,ease:"power2.in"},CR.breakAt+.27);
    crTl.to("#cr-crack-p",{opacity:0,duration:.25,ease:"power2.in"},CR.breakAt+.35);
    crTl.to("#cr-shade",{opacity:.86,duration:.35,ease:"power3.out"},CR.breakAt+.35);
    crTl.fromTo("#cr-plate",{opacity:0,scale:.62},{opacity:1,scale:1,duration:.5,ease:"power4.out"},CR.breakAt+.39);
    crTl.to("#cr-plate",{boxShadow:"0 0 74px 8px rgba(95,230,253,.62),0 26px 70px rgba(0,22,66,.5)",duration:.5,ease:"power2.out"},CR.breakAt+.55);
    crTl.fromTo("#cr-new",{opacity:0,scale:1.25},{opacity:1,scale:1,duration:.42,ease:"power4.out"},CR.breakAt+.61);

    window.__timelines["crack-reveal"]=crTl;
  </script>
</template>
</body></html>
