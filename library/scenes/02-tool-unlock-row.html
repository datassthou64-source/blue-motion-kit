<!DOCTYPE html>
<html lang="en"><head></head><body>
<!--
  TEMPLATE  02-tool-unlock-row
  ARGUMENT  "it has its own computer and it signs into your tools." A device
            sits high, a row of tool plates sits low, and a cyan pulse runs
            down each route in turn — the plate it reaches turns cyan and gets
            corner brackets. Then one artifact travels to the last plate: the
            work lands where work already lives.
  SWAP      CFG.tools (2-5 entries: label + logo). CFG.device names what is on
            top. CFG.payoff is the closing cyan line. Route curves regenerate
            from the plate positions, so changing the count is safe.
  PREFIX    tu-
  ASSETS    one real, sourced logo per tool. The inline placeholder mark is a
            stand-in ONLY — never ship it for a product the VO names.
-->
<template>
  <style>
    #tu-root{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:#FDFDFD}
    #tu-shade{position:absolute;inset:0;background:radial-gradient(ellipse 66% 72% at 50% 46%,rgba(0,22,66,.28),rgba(0,22,66,.76))}
    #tu-screen{position:absolute;left:610px;top:240px;width:700px;height:394px;border-radius:30px;border:5px solid #FDFDFD;background:rgba(4,26,72,.9);box-shadow:0 0 44px rgba(95,230,253,.28);opacity:0}
    #tu-base{position:absolute;left:530px;top:640px;width:860px;height:26px;border-radius:13px;background:rgba(253,253,253,.86);box-shadow:0 0 26px rgba(95,230,253,.4);transform-origin:50% 50%;opacity:0}
    #tu-svg{position:absolute;inset:0;width:1920px;height:1080px}
    .tu-guide{fill:none;stroke:rgba(253,253,253,.42);stroke-width:4;stroke-linecap:round;stroke-dasharray:12 16;opacity:0}
    .tu-flow{fill:none;stroke:#5FE6FD;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 15px rgba(95,230,253,.75));opacity:0}
    .tu-plate{position:absolute;top:806px;width:180px;height:180px;border-radius:40px;border:4px solid #FDFDFD;background:rgba(0,22,66,.85);box-shadow:0 0 36px rgba(95,230,253,.2),inset 0 0 50px rgba(1,183,249,.18);display:grid;place-items:center;opacity:0}
    .tu-plate img,.tu-plate svg{width:56%;height:56%;object-fit:contain;display:block}
    .tu-brk{position:absolute;width:34px;height:34px;border:4px solid #5FE6FD;opacity:0}
    .tu-lbl{position:absolute;top:1004px;font-size:24px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 22px rgba(0,0,0,.85),0 3px 14px rgba(0,0,0,.7);opacity:0}
    #tu-meta{position:absolute;left:1382px;top:420px;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:rgba(253,253,253,.86);text-shadow:0 0 22px rgba(0,0,0,.85);opacity:0}
    #tu-art{position:absolute;left:912px;top:470px;width:96px;height:70px;border-radius:16px;border:3px solid #5FE6FD;background:rgba(0,22,66,.9);box-shadow:0 0 30px rgba(95,230,253,.7);opacity:0}
    #tu-art i{position:absolute;left:14px;height:7px;border-radius:4px;background:#5FE6FD}
    #tu-out{position:absolute;top:744px;font-size:26px;font-weight:900;letter-spacing:.14em;color:#5FE6FD;white-space:nowrap;text-shadow:0 0 24px rgba(0,0,0,.85),0 0 40px rgba(95,230,253,.5);opacity:0}
  </style>

  <div data-hf-id="tu-root" id="tu-root" data-composition-id="tool-unlock" data-start="0" data-duration="8.4" data-width="1920" data-height="1080">
    <div data-hf-id="tu-shade" id="tu-shade"></div>
    <svg data-hf-id="tu-svg" id="tu-svg" viewBox="0 0 1920 1080"></svg>
    <div data-hf-id="tu-screen" id="tu-screen"></div>
    <div data-hf-id="tu-base" id="tu-base"></div>
    <div data-hf-id="tu-meta" id="tu-meta">Own Computer</div>
    <div data-hf-id="tu-art" id="tu-art"><i data-hf-id="tu-ar1" style="top:16px;width:62px"></i><i data-hf-id="tu-ar2" style="top:32px;width:44px"></i><i data-hf-id="tu-ar3" style="top:48px;width:54px"></i></div>
    <div data-hf-id="tu-out" id="tu-out">Output Lands</div>
  </div>

  <script>
    window.__timelines=window.__timelines||{};
    const tuTl=gsap.timeline({paused:true});

    /* ===== CONFIG ==================================================== */
    const TU = {
      device: "Own Computer",     // mono metadata beside the screen
      payoff: "Output Lands",     // cyan line on the final beat
      /* 2-5 tools. logo:"" falls back to a neutral placeholder mark —
         replace every one you actually name in the VO. */
      tools: [
        {label:"Chrome",    logo:""},
        {label:"Slack",     logo:""},
        {label:"HubSpot",   logo:""},
        {label:"Instantly", logo:""}
      ],
      firstUnlock: 2.05,          // when the first route fires
      gap: 0.62,                  // seconds between unlocks
      artifactAt: 5.45            // when the finished work leaves the screen
    };
    /* ================================================================= */

    const tuRoot=document.getElementById("tu-root"), tuSvg=document.getElementById("tu-svg");
    const tuN=TU.tools.length;
    const tuSpan=1520, tuStep=tuN>1?tuSpan/(tuN-1):0, tuX0=tuN>1?(1920-tuSpan)/2:960;
    const tuMark='<svg data-hf-id="PH-m" viewBox="0 0 120 120"><rect data-hf-id="PH-r" x="22" y="22" width="76" height="76" rx="20" fill="none" stroke="#FDFDFD" stroke-width="8"/></svg>';

    document.getElementById("tu-meta").textContent=TU.device;
    document.getElementById("tu-out").textContent=TU.payoff;

    const tuPlates=[],tuLabels=[],tuBrks=[];
    TU.tools.forEach(function(t,i){
      const cx = tuN>1 ? tuX0+i*tuStep : 960;
      const id="tu-p"+i;
      const d=document.createElement("div");
      d.className="tu-plate"; d.id=id; d.setAttribute("data-hf-id",id);
      d.style.left=(cx-90)+"px";
      d.innerHTML = t.logo
        ? '<img data-hf-id="'+id+'-img" src="'+t.logo+'" alt="">'
        : tuMark.replace(/PH/g,id);
      tuRoot.appendChild(d); tuPlates.push("#"+id);

      const l=document.createElement("div");
      l.className="tu-lbl"; l.id="tu-l"+i; l.setAttribute("data-hf-id","tu-l"+i);
      l.style.left=cx+"px"; l.textContent=t.label;
      tuRoot.appendChild(l); tuLabels.push("#tu-l"+i);

      /* corner brackets that close on the plate when it unlocks */
      const bA=document.createElement("i"), bB=document.createElement("i");
      bA.className="tu-brk"; bA.id="tu-ka"+i; bA.setAttribute("data-hf-id","tu-ka"+i);
      bA.style.cssText="left:"+(cx-108)+"px;top:788px;border-right:none;border-bottom:none";
      bB.className="tu-brk"; bB.id="tu-kb"+i; bB.setAttribute("data-hf-id","tu-kb"+i);
      bB.style.cssText="left:"+(cx+74)+"px;top:954px;border-left:none;border-top:none";
      tuRoot.appendChild(bA); tuRoot.appendChild(bB);
      tuBrks.push(["#tu-ka"+i,"#tu-kb"+i]);

      /* one guide + one flow per tool, curving out of the base */
      const sx = 960 + (i-(tuN-1)/2)*46, sy = 668;
      const dpath="M"+sx+" "+sy+" C"+sx+" "+(sy+90)+","+cx+" "+(sy+80)+","+cx+" 806";
      ["tu-g"+i,"tu-f"+i].forEach(function(pid,k){
        const p=document.createElementNS("http://www.w3.org/2000/svg","path");
        p.setAttribute("d",dpath); p.setAttribute("class",k?"tu-flow":"tu-guide");
        p.id=pid; p.setAttribute("data-hf-id",pid);
        tuSvg.appendChild(p);
      });
    });
    gsap.set(tuLabels.concat(["#tu-out"]),{xPercent:-50});
    gsap.set("#tu-out",{left:(tuN>1?tuX0+(tuN-1)*tuStep:960)+"px"});

    function tuFlow(sel,at,dur){
      const el=document.querySelector(sel),L=el.getTotalLength();
      el.style.strokeDasharray=90+" "+L*2; el.style.strokeDashoffset=0;
      tuTl.set(sel,{opacity:1},at);
      tuTl.fromTo(sel,{strokeDashoffset:0},{strokeDashoffset:-L-90,duration:dur,ease:"power1.inOut",immediateRender:false},at);
      tuTl.set(sel,{opacity:0},at+dur);
    }

    /* the machine stands up */
    tuTl.fromTo("#tu-screen",{opacity:0,scale:.78,y:40},{opacity:1,scale:1,y:0,duration:.62,ease:"power3.out"},.08);
    tuTl.fromTo("#tu-base",{opacity:0,scaleX:.2},{opacity:1,scaleX:1,duration:.48,ease:"power3.out"},.5);
    tuTl.fromTo("#tu-meta",{opacity:0,x:-18},{opacity:1,x:0,duration:.36,ease:"power3.out"},.85);
    tuTl.to("#tu-screen",{boxShadow:"0 0 86px rgba(95,230,253,.5)",duration:.4,ease:"power2.out"},1.0);

    /* the shelf of tools arrives */
    tuPlates.forEach(function(s,i){ tuTl.fromTo(s,{opacity:0,scale:.6,y:40},{opacity:1,scale:1,y:0,duration:.45,ease:"power3.out"},1.3+i*.1); });
    tuLabels.forEach(function(s,i){ tuTl.fromTo(s,{opacity:0,y:14},{opacity:1,y:0,duration:.32,ease:"power3.out"},1.5+i*.1); });
    tuTl.fromTo(".tu-guide",{opacity:0},{opacity:1,duration:.35,ease:"power2.out",stagger:.06},1.6);

    /* it signs into each tool in turn */
    TU.tools.forEach(function(t,i){
      const at=TU.firstUnlock+i*TU.gap;
      tuFlow("#tu-f"+i,at,.72);
      tuTl.to(tuPlates[i],{borderColor:"#5FE6FD",boxShadow:"0 0 54px rgba(95,230,253,.55),inset 0 0 50px rgba(1,183,249,.22)",duration:.34,ease:"power3.out"},at+.68);
      tuTl.fromTo(tuBrks[i][0],{opacity:0,x:16,y:16},{opacity:1,x:0,y:0,duration:.34,ease:"power3.out"},at+.68);
      tuTl.fromTo(tuBrks[i][1],{opacity:0,x:-16,y:-16},{opacity:1,x:0,y:0,duration:.34,ease:"power3.out"},at+.68);
      tuTl.to(tuPlates[i],{scale:1.07,duration:.16,ease:"power3.out"},at+.68);
      tuTl.to(tuPlates[i],{scale:1,duration:.24,ease:"power2.out"},at+.84);
    });

    /* and the finished work lands in the last one */
    const tuLastX=(tuN>1?tuX0+(tuN-1)*tuStep:960);
    tuTl.fromTo("#tu-art",{opacity:0,scale:.5},{opacity:1,scale:1,duration:.34,ease:"power3.out"},TU.artifactAt);
    tuTl.to("#tu-art",{x:tuLastX-960,y:426,duration:1.5,ease:"power2.inOut"},TU.artifactAt+.4);
    tuTl.to("#tu-art",{opacity:0,scale:.42,duration:.3,ease:"power2.in"},TU.artifactAt+1.8);
    tuTl.to(tuPlates[tuN-1],{scale:1.14,duration:.24,ease:"power4.out"},TU.artifactAt+1.85);
    tuTl.to(tuPlates[tuN-1],{scale:1.05,boxShadow:"0 0 88px rgba(95,230,253,.8),inset 0 0 50px rgba(1,183,249,.3)",duration:.4,ease:"power2.out"},TU.artifactAt+2.09);
    tuTl.fromTo("#tu-out",{opacity:0,y:16,scale:1.16},{opacity:1,y:0,scale:1,duration:.4,ease:"power4.out"},TU.artifactAt+2.05);

    window.__timelines["tool-unlock"]=tuTl;
  </script>
</template>
</body></html>
