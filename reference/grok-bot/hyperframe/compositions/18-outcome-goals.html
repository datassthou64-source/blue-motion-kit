  <script>
    window.__timelines=window.__timelines||{};
    const s18=gsap.timeline({paused:true});
    gsap.set(["#s18-meta"],{xPercent:-50});
    function s18flow(sel,at,dur){
      const el=document.querySelector(sel),L=el.getTotalLength();
      el.style.strokeDasharray=90+" "+L*2;el.style.strokeDashoffset=0;
      s18.set(sel,{opacity:1},at);
      s18.fromTo(sel,{strokeDashoffset:0},{strokeDashoffset:-L-90,duration:dur,ease:"power1.inOut",immediateRender:false},at);

    ["#s18-a","#s18-b","#s18-c","#s18-d"].forEach((id,i)=>

    s18.fromTo("#s18-goal",{opacity:0,y:-70,scale:.8},{opacity:1,y:0,scale:1,duration:.55,ease:"power3.out"},2.9);
    s18.to("#s18-goal",{borderColor:"#5fe6fd",boxShadow:"0 0 60px rgba(95,230,253,.5)",duration:.5,ease:"power2.out"},4.2);

    /* the goal drops into Eve, who articulates it downstream */
    s18.to("#s18-goal",{y:250,scale:.72,duration:.8,ease:"power2.inOut"},5.55);
    s18.to("#s18-goal",{opacity:0,duration:.3,ease:"power2.in"},6.15);
    s18.to("#s18-eve",{scale:1.1,duration:.2,ease:"power4.out"},6.3);

    s18.fromTo("#s18-meta",{opacity:0,y:14},{opacity:1,y:0,duration:.36,ease:"power3.out"},6.7);

    s18br.forEach((b,i)=>{
      const at=7.0+i*.62;
      s18flow(b.fl,at,.7);
      s18.to(b.n,{borderColor:"#5fe6fd",boxShadow:"0 0 56px rgba(95,230,253,.55)",duration:.26,ease:"power3.out"},at+.64);
      s18.to(b.p,{backgroundColor:"#5fe6fd",scale:1.4,duration:.22,ease:"power3.out"},at+.64);
      s18.to(b.p,{scale:1,duration:.28,ease:"power2.out"},at+.86);

    /* the whole tier lands on one beat and holds */
    s18.to(["#s18-ga","#s18-gb","#s18-gc","#s18-gd"],{opacity:.6,duration:.4,ease:"power2.out"},10.2);
