  </style>
  <div data-hf-id="s12-root" id="s12-root" data-composition-id="s12" data-start="0" data-duration="9.3" data-width="1920" data-height="1080">

      <path data-hf-id="s12-gB" id="s12-gB" class="s12-guide" d="M960 195 L1142.2 755.8 M960 195 L777.8 755.8 M1254.8 409.2 L777.8 755.8 M1254.8 409.2 L665.2 409.2 M1142.2 755.8 L665.2 409.2"/>

  <script>
    window.__timelines=window.__timelines||{};
    const s12=gsap.timeline({paused:true});
    gsap.set(["#s12-tag","#s12-meta"],{xPercent:-50});
    function s12flow(sel,at,dur){
      const el=document.querySelector(sel),L=el.getTotalLength();
      el.style.strokeDasharray=90+" "+L*2;el.style.strokeDashoffset=0;
      s12.set(sel,{opacity:1},at);
      s12.fromTo(sel,{strokeDashoffset:0},{strokeDashoffset:-L-90,duration:dur,ease:"power1.inOut",immediateRender:false},at);
      s12.set(sel,{opacity:0},at+dur);
    }
    ["#s12-n1","#s12-n2","#s12-n3","#s12-n4","#s12-n5"].forEach((id,i)=>
      s12.fromTo(id,{opacity:0,scale:.55},{opacity:1,scale:1,duration:.5,ease:"back.out(1.5)"},.2+i*.24));
    s12.fromTo(["#s12-gA","#s12-gB"],{opacity:0},{opacity:1,duration:.5,ease:"power2.out"},1.5);

    /* the exchanges accelerate */
    const s12seq=[
      {fl:"#s12-c1",to:"#s12-n3",pip:"#s12-p3",at:2.5,dur:.85},
      {fl:"#s12-c2",to:"#s12-n5",pip:"#s12-p5",at:3.45,dur:.78},
      {fl:"#s12-c3",to:"#s12-n2",pip:"#s12-p2",at:4.3,dur:.7},
      {fl:"#s12-c4",to:"#s12-n4",pip:"#s12-p4",at:5.05,dur:.62},
      {fl:"#s12-c5",to:"#s12-n1",pip:"#s12-p1",at:5.72,dur:.54}
    ];
    s12seq.forEach(s=>{
      s12flow(s.fl,s.at,s.dur);
      s12.to(s.to,{borderColor:"#5fe6fd",boxShadow:"0 0 60px rgba(95,230,253,.6)",duration:.24,ease:"power3.out"},s.at+s.dur-.1);
      s12.to(s.pip,{backgroundColor:"#5fe6fd",scale:1.45,duration:.22,ease:"power3.out"},s.at+s.dur-.1);
      s12.to(s.pip,{scale:1,duration:.3,ease:"power2.out"},s.at+s.dur+.14);
    });
    s12.fromTo("#s12-tag",{opacity:0,scale:1.2},{opacity:1,scale:1,duration:.42,ease:"power4.out"},6.6);
    s12.fromTo("#s12-meta",{opacity:0,y:14},{opacity:1,y:0,duration:.36,ease:"power3.out"},6.85);
    s12.to(["#s12-gA","#s12-gB"],{opacity:.5,duration:.5,ease:"power2.out"},6.6);
    s12.to(["#s12-n1","#s12-n2","#s12-n3","#s12-n4","#s12-n5"],{scale:1.05,duration:.35,ease:"sine.inOut",yoyo:true,repeat:1,stagger:.07},7.5);
