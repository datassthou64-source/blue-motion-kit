  <script>
    window.__timelines=window.__timelines||{};
    const apTl=gsap.timeline({paused:true});

    for(let i=0;i<4;i++){
      const p=document.querySelector("#ap-p"+i);
      if(!p) continue;
      const L=p.getTotalLength?p.getTotalLength():620;
      gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});
      p.__len=L;

    apTl.fromTo(".ap-node",{opacity:0,scale:.7,y:40},{opacity:.55,scale:1,y:0,duration:.46,ease:"back.out(1.4)",stagger:.06},.04);

    apTl.fromTo("#ap-srcglow",{opacity:0},{opacity:.75,duration:.44,ease:"power2.out"},.50);
    apTl.fromTo("#ap-srclabel",{opacity:0,y:16},{opacity:1,y:0,duration:.32,ease:"power3.out"},.60);

    for(let i=0;i<4;i++){
      const t0=.56+i*.07, sel="#ap-p"+i;
      apTl.to(sel,{opacity:1,duration:.1},t0);
      apTl.to(sel,{strokeDashoffset:0,duration:.6,ease:"power2.inOut"},t0);
    }

    for(let i=0;i<4;i++){
      const p=document.querySelector("#ap-p"+i);
      if(!p) continue;
      const L=p.__len||620;
      const t0=1.06+i*.15, dur=.66;
      const proxy={d:0};
      apTl.to(["#ap-t"+i,"#ap-h"+i],{opacity:1,duration:.12},t0);
      apTl.to(proxy,{d:L,duration:dur,ease:"power1.inOut",onUpdate:function(){
        if(!p.getPointAtLength) return;
        const pt=p.getPointAtLength(proxy.d);
        gsap.set(["#ap-t"+i,"#ap-h"+i],{attr:{cx:pt.x,cy:pt.y}});
      }},t0);
      apTl.to(["#ap-t"+i,"#ap-h"+i],{opacity:0,duration:.14},t0+dur-.06);
      apTl.to("#ap-n"+i,{opacity:1,scale:1.1,duration:.2,ease:"power3.out"},t0+dur-.04);
      apTl.to("#ap-n"+i,{scale:1,duration:.28,ease:"power2.out"},t0+dur+.16);
      apTl.fromTo("#ap-l"+i,{opacity:0},{opacity:1,duration:.26,ease:"power2.out"},t0+dur-.04);
    }

    apTl.to("#ap-srcglow",{opacity:.5,duration:.34,ease:"power2.inOut",overwrite:"auto"},2.30);
    apTl.to(".ap-lit",{scale:1.05,duration:.3,ease:"power2.out",stagger:.04},2.42);

    window.__timelines["apply"]=apTl;
