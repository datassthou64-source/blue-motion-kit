<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{width:1920px;height:1080px;overflow:hidden;background:#001642}
      body{font-family:Inter,sans-serif}
      #root{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fdfdfd}
      #root>[data-composition-src]{position:absolute;inset:0;width:1920px;height:1080px;z-index:7}
      #global-bg{position:absolute;inset:0;width:1920px;height:1080px;z-index:0;object-fit:cover}
    </style>
  </head>
  <body>
    <div data-hf-id="root" id="root" data-composition-id="main" data-start="0" data-duration="7.1" data-width="1920" data-height="1080">
      <video data-hf-id="global-bg" id="global-bg" class="clip" src="assets/blue-gradient-loop.mp4" data-start="0" data-duration="7.1" data-media-start="0" data-track-index="0" muted playsinline></video>
      <div data-hf-id="fleet-clip" id="fleet-clip" class="clip" data-composition-id="fleet" data-composition-src="compositions/00-fleet.html" data-start="0" data-duration="7.1" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio data-hf-id="vo" id="vo" class="clip" src="assets/vo.mp3" data-start="0" data-duration="7.06" data-media-start="0" data-track-index="20"></audio>
    </div>
    <script>
      window.__timelines=window.__timelines||{};
      window.__timelines.main=gsap.timeline({paused:true});
    </script>
  </body>
</html>
