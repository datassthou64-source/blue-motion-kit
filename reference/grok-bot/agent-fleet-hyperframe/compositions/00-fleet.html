  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({paused:true});
    const SL = [[212.0, 421.0], [586.0, 375.0], [960.0, 333.0], [1334.0, 375.0], [1708.0, 421.0]];
    const SRC = [[434, 512], [434, 396], [434, 338], [434, 570], [434, 744]];

    document.querySelectorAll("#fl-svg .fl-path").forEach(function(p){
      var L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    });

    /* each agent waits inside its row in the app sidebar */
    for (var i=0;i<5;i++) {
      gsap.set("#fl-term-"+i, {opacity:0, scale:.18, x: SRC[i][0]-SL[i][0], y: SRC[i][1]-SL[i][1]});
      gsap.set("#fl-label-"+i, {opacity:0, y:142});
    }

    /* 1 — the app stands up */
    tl.fromTo("#fl-hero", {opacity:0, scale:.72, y:70}, {opacity:1, scale:1, y:0, duration:.6, ease:"expo.out"}, .02);
    tl.fromTo(".gb-row", {opacity:0, x:-18}, {opacity:1, x:0, duration:.26, ease:"power2.out", stagger:.055}, .40);
    tl.fromTo(".gb-bub", {opacity:0, y:16}, {opacity:1, y:0, duration:.26, ease:"power2.out", stagger:.05}, .62);

    /* 2 — "agent fleet": the agents step out of the app */
    tl.to("#fl-hero", {opacity:0, scale:.9, duration:.34, ease:"power2.in"}, 1.40);
    for (var i=0;i<5;i++) {
      tl.to("#fl-term-"+i, {opacity:1, scale:1, x:0, y:126, duration:.80, ease:"power3.out"}, 1.42 + Math.abs(i-2)*.075);
    }

    /* 3 — "various functions": each agent takes its job */
    for (var i=0;i<5;i++) {
      var t = 2.30 + i*.115;
      tl.to("#fl-label-"+i, {opacity:1, y:126, duration:.34, ease:"power3.out"}, t);
      tl.fromTo("#fl-logo-"+i, {scale:.62}, {scale:1.13, duration:.34, ease:"back.out(2.2)"}, t);
      tl.to("#fl-logo-"+i, {scale:1, duration:.36, ease:"power3.out"}, t+.34);
      tl.fromTo("#fl-glow-"+i, {opacity:0}, {opacity:1, duration:.18, ease:"power2.out"}, t);
      tl.to("#fl-glow-"+i, {opacity:0, duration:.75, ease:"power2.in"}, t+.24);
    }

    /* 4 — "your business": the fleet lifts, routes draw into one core */
    for (var i=0;i<5;i++) {
      tl.to("#fl-term-"+i, {y:0, duration:.62, ease:"power3.out"}, 3.24 + Math.abs(i-2)*.05);
      tl.to("#fl-label-"+i, {y:0, duration:.62, ease:"power3.out"}, 3.24 + Math.abs(i-2)*.05);
    }
    tl.fromTo("#fl-core", {opacity:0, scale:.6}, {opacity:1, scale:1, duration:.55, ease:"back.out(1.5)"}, 3.36);
    tl.fromTo("#fl-ring", {rotate:0}, {rotate:150, duration:3.6, ease:"none"}, 3.5);
    for (var i=0;i<5;i++) {
      tl.to("#fl-path-"+i, {strokeDashoffset:0, duration:.72, ease:"power2.inOut"}, 3.62 + Math.abs(i-2)*.08);
    }

    /* 5 — "run your business": the work flows down every route */
    var FLP = [];
    for (var i=0;i<5;i++) FLP.push(document.getElementById("fl-path-"+i));
    function flRide(i, st) {
      var path = FLP[i], L = path.getTotalLength();
      var tok = document.getElementById("fl-tok-"+i);
      var halo = document.getElementById("fl-halo-"+i);
      var prox = {p:0};
      tl.fromTo(prox, {p:0}, {p:1, duration:.86, ease:"none",
        onUpdate:function(){
          var pt = path.getPointAtLength(prox.p*L);
          tok.setAttribute("cx", pt.x); tok.setAttribute("cy", pt.y);
          halo.setAttribute("cx", pt.x); halo.setAttribute("cy", pt.y);
        }}, st);
      tl.fromTo([tok, halo], {opacity:0}, {opacity:1, duration:.12, ease:"power2.out"}, st);
      tl.to(tok, {opacity:0, duration:.16, ease:"power2.in"}, st+.72);
      tl.to(halo, {opacity:0, duration:.16, ease:"power2.in"}, st+.72);
    }
    for (var i=0;i<5;i++) for (var k=0;k<3;k++) flRide(i, 4.30 + k*.66 + Math.abs(i-2)*.09);
    tl.to("#fl-core", {boxShadow:"inset 0 0 110px rgba(1,183,249,.62),0 0 96px rgba(95,230,253,.55)", duration:1.2, ease:"power2.out"}, 4.5);

    /* 6 — "in 2026": the core is fully lit and the fleet is the system */
    tl.to("#fl-core", {boxShadow:"inset 0 0 130px rgba(1,183,249,.82),0 0 118px rgba(95,230,253,.72)", duration:.75, ease:"power2.out"}, 6.02);

    window.__timelines["fleet"] = tl;
  </script>
